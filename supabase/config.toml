project_id = "default"

# mp-webhook es invocado por Mercado Pago (server-to-server, sin apikey
# ni JWT de Supabase). La autenticación real es la firma HMAC con
# MP_WEBHOOK_SECRET, validada dentro de la función.
[functions.mp-webhook]
verify_jwt = false

# request-withdrawal acepta llamadas con o sin sesión (el botón de
# arrepentimiento también lo usa quien no está logueado); la identidad
# se valida dentro de la función.
[functions.request-withdrawal]
verify_jwt = false
